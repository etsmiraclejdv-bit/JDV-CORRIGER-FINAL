name: One-time full lint repair
on:
  push:
    branches:
      - fix/typescript-supabase-client
permissions:
  contents: write
jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typescript-supabase-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format all source files and auto-fix lint rules
        run: |
          npm run format
          npm run lint:fix || true
      - name: Commit formatting changes and remove temporary workflow
        run: |
          rm .github/workflows/format-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(lint): format source and apply safe lint fixes"
          git push origin HEAD:fix/typescript-supabase-client
