name: One-time lint formatting repair
on:
  push:
    branches:
      - fix/typescript-supabase-client
permissions:
  contents: write
jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typescript-supabase-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format lint findings
        run: |
          npx prettier --write 'src/app/a-propos-concepteur/page.tsx' 'src/app/api/ai/jdv-crm/route.ts' 'src/app/api/business/create-prospecteur/route.ts' 'src/app/api/business/create-warehouse-manager/route.ts' 'src/app/api/commissions/payout/route.ts' 'src/app/api/fedapay/initiate-subscription/route.ts' 'src/app/api/fedapay-webhook/route.ts' 'src/app/business/dashboard/catalogue/page.tsx' 'src/app/business/dashboard/clients/[id]/page.tsx' 'src/app/business/dashboard/clients/page.tsx'
          python3 -c "from pathlib import Path; p=Path('src/app/business/dashboard/catalogue/page.tsx'); p.write_text(p.read_text().replace(\"Nom de l'article</label>\", \"Nom de l’article</label>\"))"
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/format-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(lint): run Prettier formatting pass"
          git push origin HEAD:fix/typescript-supabase-client
