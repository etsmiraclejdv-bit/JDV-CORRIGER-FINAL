# CI quality gate: tests, TypeScript, lint and strict build must be checked on the latest tree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bloquant : échoue si package-lock.json n'est pas synchronisé avec package.json
      - name: Installer les dépendances (reproductible)
        run: npm ci

      - name: Format files currently blocking strict lint
        run: |
          npx prettier --write \
            src/app/business/dashboard/avis-clients/page.tsx \
            src/app/business/dashboard/equipe/page.tsx \
            src/app/business/dashboard/formulaires/page.tsx \
            src/app/business/dashboard/layout.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain -- src/app/business/dashboard/avis-clients/page.tsx src/app/business/dashboard/equipe/page.tsx src/app/business/dashboard/formulaires/page.tsx src/app/business/dashboard/layout.tsx)" ]]; then
            git add src/app/business/dashboard/avis-clients/page.tsx src/app/business/dashboard/equipe/page.tsx src/app/business/dashboard/formulaires/page.tsx src/app/business/dashboard/layout.tsx
            git commit -m "style: format remaining files required by lint gate"
            git push origin HEAD:fix/duplicate-lucide-import
          fi

      # Bloquant : tests unitaires (assainissement, IP client, limiteur de débit)
      - name: Tests
        run: npm test

      # Bloquant : aucune erreur TypeScript ne doit passer.
      - name: Vérification des types
        run: npm run type-check

      # Required gate: all ESLint and Prettier errors must be fixed.
      - name: Lint
        run: npm run lint

      - name: Build strict
        run: npm run build
        env:
          STRICT_BUILD: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
