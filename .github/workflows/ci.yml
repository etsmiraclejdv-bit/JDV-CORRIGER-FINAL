name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bloquant : échoue si package-lock.json n'est pas synchronisé avec package.json
      - name: Installer les dépendances (reproductible)
        run: npm ci

      # Bloquant : tests unitaires (assainissement, IP client, limiteur de débit)
      - name: Tests
        run: npm test

      # Bloquant : aucune erreur TypeScript ne doit passer.
      - name: Vérification des types
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build strict
        run: npm run build
        env:
          STRICT_BUILD: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
