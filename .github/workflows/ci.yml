name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Bloquant : échoue si package-lock.json n'est pas synchronisé avec package.json
      - name: Installer les dépendances (reproductible)
        run: npm ci

      # Bloquant : tests unitaires (assainissement, IP client, limiteur de débit)
      - name: Tests
        run: npm test

      # Consultatifs tant que le projet n'est pas propre : retirer `continue-on-error`
      # une fois ces deux commandes au vert, puis activer STRICT_BUILD=true au déploiement.
      - name: Vérification des types
        run: npm run type-check
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
