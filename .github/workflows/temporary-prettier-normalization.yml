name: Temporary Prettier normalization

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/business/dashboard/page.tsx'
      - 'src/app/components/PublicAccountBanner.tsx'
      - 'src/app/entrepot/dashboard/page.tsx'
      - 'src/app/entrepot/dashboard/layout.tsx'
      - '.github/workflows/temporary-prettier-normalization.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format only CI-blocking files
        run: npx prettier --write src/app/business/dashboard/page.tsx src/app/components/PublicAccountBanner.tsx src/app/entrepot/dashboard/page.tsx src/app/entrepot/dashboard/layout.tsx
      - name: Commit formatting when needed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/business/dashboard/page.tsx src/app/components/PublicAccountBanner.tsx src/app/entrepot/dashboard/page.tsx src/app/entrepot/dashboard/layout.tsx
            git commit -m "style: apply Prettier to CI-blocking files"
            git push
          fi
