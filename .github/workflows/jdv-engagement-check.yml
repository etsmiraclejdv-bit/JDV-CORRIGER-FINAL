name: JDV engagement hub checks

on:
  pull_request:
    paths:
      - 'src/app/api/jdv-news/**'
      - 'src/app/business/dashboard/ambiance/**'
      - 'src/app/business/dashboard/avis-clients/**'
      - 'src/app/business/dashboard/veille/**'
      - 'src/app/business/dashboard/layout.tsx'
      - 'src/components/OrganizationAmbience.tsx'
      - 'supabase/migrations/20261011142908_jdv_ambience_news_reviews_v1.sql'
      - 'supabase/migrations/20261011143016_jdv_background_storage_org_listing_v1.sql'
  push:
    branches:
      - feature/jdv-engagement-hub-reconciled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jdv-engagement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and focused TypeScript regression check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Automated tests
        run: npm test
      - name: Focused TypeScript check for engagement files
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/jdv-tsc.log 2>&1
          tsc_status=$?
          set -e
          if grep -E 'src/app/api/jdv-news/route.ts|src/app/business/dashboard/(ambiance|avis-clients|veille)/page.tsx|src/app/business/dashboard/layout.tsx|src/components/OrganizationAmbience.tsx' /tmp/jdv-tsc.log; then
            echo "TypeScript errors detected in the engagement hub files."
            exit 1
          fi
          if [ "$tsc_status" -ne 0 ]; then
            count=$(grep -c 'error TS' /tmp/jdv-tsc.log || true)
            echo "No TypeScript errors in the engagement hub files; the existing repository-wide check reports $count diagnostics outside these files."
          else
            echo "TypeScript check passed without diagnostics."
          fi
