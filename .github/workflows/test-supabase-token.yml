
name: Test Supabase Access Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    name: Verify token without database changes
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Check secret presence without displaying it
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing or empty."
            exit 1
          fi
          echo "Secret is present. Its value will not be displayed."

      - name: Verify authentication with Supabase
        shell: bash
        run: |
          set +x
          if supabase projects list >/dev/null 2>&1; then
            echo "SUCCESS: Supabase accepted the access token."
          else
            echo "::error::Authentication failed. Check token validity and permissions."
            exit 1
          fi
